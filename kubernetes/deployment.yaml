apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-app
  namespace: taskflow
  labels:
    app: taskflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: YOUR_DOCKER_USERNAME/taskflow:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
