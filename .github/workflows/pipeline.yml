name: TaskFlow CI/CD Platform

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow:${{ github.run_number }} ./app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow:latest ./app
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2 K3s
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Force the runner to use standard secure algorithms compatible with modern Ubuntu versions
          key_ciphers: aes128-gcm@openssh.com,aes256-gcm@openssh.com
          script: |
            export KUBECONFIG=~/.kube/config
            kubectl create namespace taskflow --dry-run=client -o yaml | kubectl apply -f -
            curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/kubernetes/deployment.yaml | sed 's|YOUR_DOCKER_USERNAME|${{ secrets.DOCKER_USERNAME }}|g' | kubectl apply -f -
            kubectl set image deployment/taskflow-app taskflow=${{ secrets.DOCKER_USERNAME }}/taskflow:${{ github.run_number }} -n taskflow
            curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/kubernetes/service.yaml | kubectl apply -f -
